<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header{
            display: flex;
            justify-content: center;
            width: 100%;
            height: 109px;
        }
        input{
            width: 300px;
            height: 30px;
            margin: 20px 0 20px 20px;
            font-size: 16px;
            padding: 20px;
            border-radius: 30px;
        }
        .search{
            display: flex;
            justify-content: center;
        }
        .pokemon_list{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            height: auto;
        }
        .pokemon_item{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 160px;
            height: 300px;
            margin: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            background-color: white;
            .id{
                display: flex;
                justify-content: center;
                width: 100%;
                height: 10%;
            }
            .image{
                display: flex;
                justify-content: center;
                align-items: center;
                width: 100%;
                height: 60%;
                object-fit: zoom;
            }
            .name{
                width: 100%;
                height: 10%;
                margin-top: 10px;
            }
            .type{
                margin : 10px 10px 10px 10px;
                padding: 5px 10px 5px 10px;
                border-radius: 5px;
                border: 1px solid black;
                font-size: 14px;
                font-weight: bold;
            }
        }
        p{
            margin: 0 0 0 0;
            display: flex;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }
        .all_type{
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .pokemon_item:hover{
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>
            POKEMON API
        </h2>
    </div>
    <div class="search">
        <input type="text" placeholder="Nhập tên pokemon" >
    </div>
    <div class="pokemon_list">
    </div>
