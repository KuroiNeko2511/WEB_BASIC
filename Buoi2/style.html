<!DOCTYPE html>

<head>

    <title>Document</title>
    <link rel="stylesheet" href="./style.css">

    <style>
        /* important-> inline ->id -> class -> universal  */
        *{
            margin: 50px !important;
            /* padding: 0; */
            box-sizing: border-box;
        }
        .box {

            width: 200px;
            height: 100px;
            background-color: blue;
            color: white;
        }
        #box1{
            width: 200px;
            height: 200px;

            margin: 20px;
            text-align: center;
            align-content: center;
            border: 5px solid black;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <!-- một số thẻ block  -->

    <!-- img, audio,video,...button,input -->

    <span class="conteiner">

        <p style="background-color: red; width: 200px; height: 100px;">thẻ block</p>
