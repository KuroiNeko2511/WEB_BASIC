<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 5px solid black;
            width: 200px;
            height: 200px;
            margin: 20px;
        }
        .image{
            width: 100%;
            height: 100%;
        }
        .fill{
            object-fit: fill;
        }
        .cover{
            object-fit: cover;
        }
        .contain{
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="box">
        <img class="image fill" src="./image.png" alt="w3school" >
    </div>
    <div class="box">
        <img class="image cover" src="./image.png" alt="w3school" >
    </div>
    <div class="box">
        <img class="image contain" src="./image.png" alt="w3school" >
    </div>
</body>
</html>
