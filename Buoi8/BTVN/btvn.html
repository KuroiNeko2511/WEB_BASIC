<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="btvn.css">
</head>
<body>
    <div class="container">
        <div class="box1">
            <input placeholder="Nhập mã màu">
            <input placeholder="Nhập chiều cao (px)">
            <input placeholder="Nhập chiều rộng (px)">
        </div>
        <button class="box2">
            Submit
        </button>
    </div>
    <div class="box3">
        <div class="boxColor"></div>
    </div>
    <script>
        let button = document.querySelector('.box2');
        button.addEventListener('click', function() {
            let color = document.querySelector('input:nth-child(1)').value;
            let height = document.querySelector('input:nth-child(2)').value;
            let width = document.querySelector('input:nth-child(3)').value;

            let boxColor = document.querySelector('.boxColor');
            boxColor.style.backgroundColor = color;
            boxColor.style.height = height + 'px';
            boxColor.style.width = width + 'px';
        });
    </script>
</body>
</html>
